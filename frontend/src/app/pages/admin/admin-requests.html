<div class="card">
  <h2>Account Requests</h2>
  <p>Manage pending account registration requests from users.</p>

  <p-table [value]="requests" [loading]="isLoading" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Email</th>
        <th>Requested Role</th>
        <th>Message</th>
        <th style="width: 200px">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-req>
      <tr>
        <td>{{ req.created_at | date:'medium' }}</td>
        <td>{{ req.first_name }} {{ req.last_name }}</td>
        <td>{{ req.email }}</td>
        <td>
          <span class="p-badge" [ngClass]="{
            'bg-purple-600': req.role === 'admin',
            'bg-orange-500': req.role === 'engineer',
            'bg-gray-500': req.role === 'general'
          }">{{ req.role | titlecase }}</span>
        </td>
        <td>{{ req.message }}</td>
        <td>
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-check" 
              severity="success" 
              [text]="true"
              size="small"
              [loading]="processingId === req.id"
              (onClick)="approveRequest(req)"
              pTooltip="Approve & Send Email">
            </p-button>
            <p-button 
              icon="pi pi-times" 
              severity="danger" 
              [text]="true"
              size="small"
              [loading]="processingId === req.id"
              (onClick)="rejectRequest(req)"
              pTooltip="Reject">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center">No pending requests found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-toast></p-toast>
