<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="pi pi-key"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your new password below</p>
    </div>

    <div class="login-form">
      <div *ngIf="errorMsg" class="error-banner">
        <i class="pi pi-exclamation-triangle"></i> {{ errorMsg }}
      </div>

      <div *ngIf="successMsg" class="success-banner">
        <i class="pi pi-check-circle"></i> {{ successMsg }}
      </div>

      <ng-container *ngIf="!successMsg">
        <div class="field">
          <label>New Password</label>
          <p-password [(ngModel)]="newPassword" [toggleMask]="true" placeholder="••••••••"
            [disabled]="isLoading || !token" styleClass="w-full">
          </p-password>
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <p-password [(ngModel)]="confirmPassword" [feedback]="false" [toggleMask]="true" placeholder="••••••••"
            [disabled]="isLoading || !token" styleClass="w-full">
          </p-password>
        </div>

        <p-button
          [label]="isLoading ? 'Resetting...' : 'Reset Password'"
          icon="pi pi-check"
          styleClass="w-full mt-3"
          [loading]="isLoading"
          [disabled]="isLoading || !token || !newPassword || !confirmPassword"
          (onClick)="resetPassword()">
        </p-button>
      </ng-container>

      <div class="back-link">
        <a routerLink="/auth/login"><i class="pi pi-arrow-left"></i> Back to login</a>
      </div>

    </div>
  </div>
</div>
